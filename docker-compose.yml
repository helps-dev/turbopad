services:
  turbopad:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turbopad-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
    volumes:
      - turbopad-data:/app/data
    expose:
      - "3001"
    networks:
      - turbopad-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: turbopad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      turbopad:
        condition: service_healthy
    networks:
      - turbopad-network

  certbot:
    image: certbot/certbot
    container_name: turbopad-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - turbopad-network

volumes:
  turbopad-data:
    name: turbopad_sqlite_data
  certbot-etc:
    name: turbopad_certbot_etc
  certbot-var:
    name: turbopad_certbot_var
  certbot-webroot:
    name: turbopad_certbot_webroot

networks:
  turbopad-network:
    name: turbopad_net
    driver: bridge
